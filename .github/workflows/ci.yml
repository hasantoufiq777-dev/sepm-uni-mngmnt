name: University Management System CI

on: [push, pull_request, workflow_dispatch]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run Unit Tests (6 tests)
        run: mvn test -Dtest=UniversityUnitTest

      - name: Run Integration Tests (3 tests)
        run: mvn test -Dtest=UniversityIntegrationTest

      - name: Run Full Test Suite (9 tests)
        run: mvn clean test
